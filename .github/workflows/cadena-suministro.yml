# Pipeline de la cadena de suministro segura de ReportAudit.
# Se ejecuta en cada Pull Request hacia main y en cada push a main.
name: Cadena de suministro segura

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Mínimo privilegio: por defecto, los jobs solo pueden LEER el repositorio.
permissions:
  contents: read

jobs:
  sonarqube-cloud:
    name: SAST - SonarQube Cloud
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código con todo su historial
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Omitir análisis en CI cuando SonarCloud tiene Automatic Analysis
        if: ${{ vars.SONAR_CI_ENABLED != 'true' }}
        run: |
          echo "SonarQube Cloud en CI está desactivado."
          echo "Define la variable SONAR_CI_ENABLED=true cuando desactives Automatic Analysis en SonarCloud."

      - name: Analizar con SonarQube Cloud
        if: ${{ vars.SONAR_CI_ENABLED == 'true' }}
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar CodeQL para Python
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended

      - name: Ejecutar el análisis y publicar los resultados
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
